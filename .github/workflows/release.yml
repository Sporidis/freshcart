name: Release

# Pushing a version tag (`git tag v1.0.4 && git push origin v1.0.4`) builds
# the signed Android APK and the web demo, then publishes one GitHub Release
# with both: freshcart-<version>.apk for the family's phones, and
# freshcart-demo-web.zip, which the portfolio site pins and embeds.
#
# The APK is also a Shorebird release, so small Dart-only fixes can follow
# as patches (patch.yml) instead of a new version. A release is for anything
# a patch can't carry: native code, plugins, assets, the Flutter version.
on:
  push:
    tags: ['v*']

env:
  # Keep in step with ci.yml.
  FLUTTER_VERSION: '3.47.2'
  SERVER_URL: 'https://freshcart-nikos.duckdns.org/'

jobs:
  web-demo:
    name: Web demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      # Same generated code as ci.yml: none of it is committed.
      - name: Generate domain code
        working-directory: packages/freshcart_domain
        run: dart run build_runner build
      - name: Generate translations
        working-directory: packages/freshcart_l10n
        run: dart run slang
      - name: Generate app code
        working-directory: freshcart_flutter
        run: dart run build_runner build

      # build_demo.sh copies its trimmed output into a portfolio checkout's
      # web/ folder. An empty stand-in folder gives the same result here.
      - name: Build demo
        working-directory: freshcart_flutter
        env:
          PORTFOLIO: ${{ runner.temp }}/site
        run: |
          mkdir -p "$PORTFOLIO/web"
          ./tool/build_demo.sh

      - name: Package demo
        working-directory: ${{ runner.temp }}/site/web/demo/freshcart
        run: zip -qr "$GITHUB_WORKSPACE/freshcart-demo-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: web-demo
          path: freshcart-demo-web.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The release key's certificate. Public: any APK shows it.
      RELEASE_CERT_SHA256: a4d50e53e7de14afe65cea5e7c3ab279eab2189c02502a82c2571666a98f07a4
    steps:
      - uses: actions/checkout@v5

      # The APK's versionCode comes from pubspec.yaml, and Android refuses an
      # update whose versionCode isn't higher. A tag that doesn't match the
      # pubspec would publish "1.0.4" containing 1.0.3.
      - name: Check the tag matches pubspec.yaml
        working-directory: freshcart_flutter
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pubspec="$(grep '^version:' pubspec.yaml | cut -d' ' -f2)"
          if [[ "$tag" != "${pubspec%%+*}" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME, but pubspec.yaml says $pubspec. Bump the pubspec version (name and the number after +), commit, and tag again."
            exit 1
          fi

      - uses: ./.github/actions/prepare-android-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          firebase-options-dart: ${{ secrets.FIREBASE_OPTIONS_DART }}

      # The keystore goes to the runner's temp folder, outside the checkout,
      # so no later step can pick it up by accident.
      #
      # It's checked before the build, not only after: `shorebird release`
      # uploads as it builds, and a release with the wrong key would then
      # take up its version number in Shorebird for good.
      - name: Write signing key
        working-directory: freshcart_flutter
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # keytool prints the fingerprint as A4:D5:0E:...; compare it bare.
          fingerprint="$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" \
              -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          if [[ "$fingerprint" != "$RELEASE_CERT_SHA256" ]]; then
            echo "::error::The keystore in the secrets isn't the FreshCart release key"
            exit 1
          fi
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      # A Shorebird release, not a plain `flutter build`: Shorebird keeps a
      # copy of this build, which every later patch is compared against.
      # An APK built any other way can't receive patches.
      - name: Build APK
        uses: shorebirdtech/shorebird-release@v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          platform: android
          flutter-version: ${{ env.FLUTTER_VERSION }}
          working-directory: freshcart_flutter
          # Patches pass the same SERVER_URL (patch.yml): a patch built
          # without it would point the phones at the wrong server.
          args: --artifact=apk -- --dart-define=SERVER_URL=${{ env.SERVER_URL }}
      - name: Name the APK
        run: |
          mv freshcart_flutter/build/app/outputs/flutter-apk/app-release.apk \
            "freshcart-${GITHUB_REF_NAME#v}.apk"

      # build.gradle.kts falls back to the debug key when key.properties is
      # missing or unreadable, and the build still passes. An APK signed with
      # any key but the release one can't update the phones, so fail here
      # instead of publishing it.
      - name: Check the APK has the release signature
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          if ! "$apksigner" verify --print-certs freshcart-*.apk \
              | grep -q "SHA-256 digest: $RELEASE_CERT_SHA256"; then
            echo "::error::The APK isn't signed with the FreshCart release key"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: freshcart-*.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [web-demo, android]
    runs-on: ubuntu-latest
    # The only job that can write to the repo, and it never sees the secrets.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            freshcart-*.apk freshcart-demo-web.zip \
            --title "FreshCart ${GITHUB_REF_NAME#v}" --generate-notes
