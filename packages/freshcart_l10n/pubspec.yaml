name: freshcart_l10n
description: >-
  Shared slang translations (nl default, en, fr, ru, tl) used by both the Flutter app
  and the Jaspr marketing site. Pure Dart — the Flutter-specific slang bindings
  are added by freshcart_flutter, not here.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  slang: ^4.19.1

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.6
  # No build_runner / slang_build_runner: that builder only reads build.yaml
  # (which this repo has none of), never slang.yaml, so `build_runner build`
  # here would silently regenerate with every slang default instead of this
  # package's config. Regenerate with `dart run slang` — see CLAUDE.md.
