name: freshcart_l10n
description: >-
  Shared slang translations (nl default, en, fr, ru, tl) used by both the Flutter app
  and the Jaspr marketing site. Pure Dart — the Flutter-specific slang bindings
  are added by freshcart_flutter, not here.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  slang: ^4.19.1

dev_dependencies:
  build_runner: ^2.10.0
  flutter_lints: ^6.0.0
  slang_build_runner: ^4.19.0
  test: ^1.25.6
