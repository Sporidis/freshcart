services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: freshcart
      POSTGRES_PASSWORD: "izIUEcQO878DoCjW4nqXHoG6XZkddSap"
    volumes:
      - freshcart_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "IOezBPNFP46b4vyonPCS2j4s8_SyBBeU"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: freshcart_test
      POSTGRES_PASSWORD: "ppk6rn6Ew9Kb64WNuwJXKAaB_ncrg5r8"
    volumes:
      - freshcart_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "NiSEcACkT2yZGP1ZwSOq1qzTmgoNigb0"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  freshcart_data:
  freshcart_test_data:
