# Template for config/passwords.yaml, which is gitignored because it holds real
# staging/production secrets.
#
# First-time setup:
#   cp config/passwords.example.yaml config/passwords.yaml
#
# The `development` and `test` values below are throwaway local-container
# credentials and MUST match docker-compose.yaml's POSTGRES_PASSWORD entries —
# they are committed on purpose so a fresh clone boots without hunting for
# values. Everything under `staging` and `production` is a placeholder: generate
# real secrets and never commit them.

shared:
  mySharedPassword: 'CHANGE_ME'

# Local development — matches docker-compose.yaml service `postgres`.
development:
  database: 'izIUEcQO878DoCjW4nqXHoG6XZkddSap'
  redis: 'IOezBPNFP46b4vyonPCS2j4s8_SyBBeU'
  serviceSecret: 'nSY5IujI16S5zg7C2zlChm9VeZnFuvoy'
  emailSecretHashPepper: 'vCOFt7FKr4XREmJ19lucF4KLvDWLRt3f'
  jwtHmacSha512PrivateKey: 'pl1qe75JE7eXXADmiTbGYwWOPkAH3gYk'
  jwtRefreshTokenHashPepper: '3iEFulvj3swvmI6vbjmuCC-k5BvwCzdy'
  # Optional here: without these, emails (login codes) are only logged.
  # Set both to send real email through Brevo (brevoSenderEmail must be a
  # verified sender in Brevo).
  # brevoApiKey: 'xkeysib-...'
  # brevoSenderEmail: 'you@example.com'

# Integration tests — matches docker-compose.yaml service `postgres_test`.
test:
  database: 'ppk6rn6Ew9Kb64WNuwJXKAaB_ncrg5r8'
  redis: 'NiSEcACkT2yZGP1ZwSOq1qzTmgoNigb0'
  emailSecretHashPepper: 'cDVpLlMd8rIOOkuOR8DTsCIHYoQF9Z2U'
  jwtHmacSha512PrivateKey: '_R3WrSI-wYLIejauBicByzSYI06AIeuZ'
  jwtRefreshTokenHashPepper: 'E_cFL0-MFaWjDYxWAobC0CRqqG8J3Ah8'

# ---------------------------------------------------------------------------
# Generate real values before deploying. e.g. `openssl rand -base64 32`
# ---------------------------------------------------------------------------
staging:
  database: 'REPLACE_WITH_REAL_SECRET'
  serviceSecret: 'REPLACE_WITH_REAL_SECRET'
  emailSecretHashPepper: 'REPLACE_WITH_REAL_SECRET'
  jwtHmacSha512PrivateKey: 'REPLACE_WITH_REAL_SECRET'
  jwtRefreshTokenHashPepper: 'REPLACE_WITH_REAL_SECRET'
  # Required: the server won't start here without real email.
  brevoApiKey: 'REPLACE_WITH_REAL_SECRET'
  brevoSenderEmail: 'REPLACE_WITH_VERIFIED_SENDER'

production:
  database: 'REPLACE_WITH_REAL_SECRET'
  serviceSecret: 'REPLACE_WITH_REAL_SECRET'
  emailSecretHashPepper: 'REPLACE_WITH_REAL_SECRET'
  jwtHmacSha512PrivateKey: 'REPLACE_WITH_REAL_SECRET'
  jwtRefreshTokenHashPepper: 'REPLACE_WITH_REAL_SECRET'
  # Required: the server won't start here without real email.
  brevoApiKey: 'REPLACE_WITH_REAL_SECRET'
  brevoSenderEmail: 'REPLACE_WITH_VERIFIED_SENDER'
