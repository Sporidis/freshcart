name: freshcart_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.8.0'

resolution: workspace

dependencies:
  # The server may depend on the pure domain (see the import matrix in
  # docs/architecture.md). This is the payoff of a shared domain package:
  # the join-code alphabet and its validation have exactly one definition,
  # used by both the server that generates codes and the app that parses them.
  freshcart_domain:
    path: ../packages/freshcart_domain
  googleapis_auth: ^2.3.3
  http: ^1.6.0
  # Re-encodes uploaded avatar photos, which drops their metadata (EXIF,
  # incl. GPS) before they're served publicly. Pure Dart: no native
  # library on the server.
  image: 4.12.0
  serverpod: 3.4.13
  serverpod_auth_idp_server: 3.4.13
  # For ServerpodRole (server.dart); already part of Serverpod, same version.
  serverpod_shared: 3.4.13

dev_dependencies:
  flutter_lints: ^6.0.0
  serverpod_test: 3.4.13
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\freshcart_flutter
        && flutter build web --base-href /app/ --wasm
        && xcopy /E /I /Y build\web ..\freshcart_server\web\app
      posix: |
        cd ../freshcart_flutter
        flutter build web --base-href /app/ --wasm --output ../freshcart_server/web/app
