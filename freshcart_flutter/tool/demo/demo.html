<!DOCTYPE html>
<!--
  Dev-only host page for the FreshCart web demo (docs/web-demo-plan.md).
  Does what the portfolio's modal does: defines window.freshcartDemo before
  flutter_bootstrap.js runs, starts the engine in multi-view mode, and adds
  one view per phone. "Close" / "Open" remove and add the views again, like
  the modal closing and reopening.

  Lives outside web/ so the normal PWA build doesn't ship it. Run it with:

    ./tool/build_demo.sh --serve      # then open http://localhost:8090/demo.html
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshCart demo (dev)</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #2b2b28;
      font-family: system-ui, sans-serif;
      color: #ddd;
    }
    .phones { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; }
    figure { margin: 0; }
    /* Centre only the caption: text-align is inherited, and on the host it
       would shift Flutter's own elements off-centre. */
    figcaption { text-align: center; margin-top: 8px; }
    /* The multi-view docs require explicit size, a positioning context and
       overflow: hidden on every host element. */
    .phone {
      position: relative;
      overflow: hidden;
      width: 390px;
      height: 760px;
      border-radius: 28px;
      background: #fafaf8;
    }
    button { font: inherit; padding: 6px 14px; }
  </style>
</head>
<body>
  <div>
    <button id="close" disabled>Close</button>
    <button id="open" disabled>Open</button>
  </div>
  <div class="phones">
    <figure><div class="phone" id="phone-a"></div><figcaption>A · Nikolaos</figcaption></figure>
    <figure><div class="phone" id="phone-b"></div><figcaption>B · Anna</figcaption></figure>
  </div>

  <script>
    // Must exist before flutter_bootstrap.js runs, so it takes the demo
    // branch instead of starting the normal app.
    window.freshcartDemo = {
      boot(flutter) {
        flutter.loader.load({
          onEntrypointLoaded: async (engineInitializer) => {
            const engine = await engineInitializer.initializeEngine({
              multiViewEnabled: true,
            });
            const app = await engine.runApp();
            let viewIds = [];

            const open = () => {
              if (viewIds.length) return;
              viewIds = ['a', 'b'].map((persona) => app.addView({
                hostElement: document.getElementById(`phone-${persona}`),
                initialData: { persona },
              }));
            };
            const close = () => {
              viewIds.forEach((id) => app.removeView(id));
              viewIds = [];
            };

            document.getElementById('open').onclick = open;
            document.getElementById('close').onclick = close;
            document.getElementById('open').disabled = false;
            document.getElementById('close').disabled = false;
            // For scripted checks (tool/demo is dev-only).
            window.freshcartDemoDev = { open, close };
            open();
          },
        });
      },
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
